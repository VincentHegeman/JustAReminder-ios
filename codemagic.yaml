# JustAReminder — iOS TestFlight met APNs, Family-fix en StoreKit-voorbereiding.
# Publieke App Store-publicatie is uitgeschakeld. StoreKit-aankopen blijven uit.
# De native StoreKit-plugin toont alleen producten en herstelinformatie tot backendrechten klaar zijn.
workflows:
  ios-ipa-controle:
    name: JustAReminder - Family-fix en StoreKit-sandboxfundament (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: JustAReminder
    environment:
      node: v22.11.0
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: eu.justareminder.app
    scripts:
      - name: Installeer layoutfix, Family-invoerfix en native pushplugin
        script: |
          set -eu
          echo "JAR BRONCODE: branch=${CM_BRANCH:-onbekend} commit=$(git rev-parse --short HEAD)"
          if grep -Fq 'transaction.environment' JARStoreKitSandbox.swift; then
            echo "FOUT: oude StoreKit-code gevonden; iOS 15 Swift compileert niet." >&2
            exit 1
          fi
          node installeer-ios-layoutfix.mjs .
          node test-ios-layoutfix.mjs .
          npm run check:ioskeyboard
          node fix-family-mobile-forms.mjs .
          node test-family-mobile-forms.mjs .
          node jar-install-storekit-sandbox.mjs
          node jar-test-storekit-sandbox.mjs
          node jar-install-native-push.mjs
          npm install
          node --check www/ios/native-push.js
          npm run check
          node scripts/check-github.mjs
          npm run check:iosfix
          npm run check:session
          npm run check:navigation
          npm run audit:source
          if [ "${JAR_RELEASE_CHANNEL:-testflight}" = "production" ]; then
            npm run audit:release
          fi
      - name: Genereer Capacitor 8 iOS en activeer APNs
        script: |
          set -eu
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          test -f ios/App/App.xcodeproj/project.pbxproj
          node jar-install-native-push.mjs --native
          node jar-install-storekit-sandbox.mjs --native
          if grep -Fq 'transaction.environment' ios/App/App/AppDelegate.swift; then
            echo "FOUT: oude StoreKit-code in AppDelegate. Stop voor IPA-archief." >&2
            exit 1
          fi
          grep -Fq 'signedEnvironmentHint' ios/App/App/AppDelegate.swift || {
            echo "FOUT: iOS 15 StoreKit-correctie niet geïnstalleerd." >&2
            exit 1
          }
          # Gebruik de oplopende Codemagic-projectteller, nooit opnieuw Apple build 5.
          case "${PROJECT_BUILD_NUMBER:-}" in
            ''|*[!0-9]*) echo 'Ongeldige PROJECT_BUILD_NUMBER' >&2; exit 1 ;;
          esac
          export JAR_IOS_BUILD_NUMBER="$((5 + PROJECT_BUILD_NUMBER))"
          echo "Apple buildnummer: ${JAR_IOS_BUILD_NUMBER}"
          node scripts/apply-ios-assets.mjs
      - name: Configureer code signing
        script: |
          set -eu
          cd ios/App
          xcode-project use-profiles
      - name: Bouw IPA voor TestFlight
        script: |
          set -eu
          cd ios/App
          xcode-project build-ipa \
            --project 'App.xcodeproj' \
            --scheme 'App' \
            --config 'Release'
      - name: Controleer APNs-entitlement van ondertekende IPA
        script: |
          set -eu
          IPA="ios/App/build/ios/ipa/App.ipa"
          test -f "$IPA"
          mkdir -p /tmp/jar-apns-validation
          unzip -q -o "$IPA" -d /tmp/jar-apns-validation
          codesign -d --entitlements :- /tmp/jar-apns-validation/Payload/App.app > /tmp/jar-apns-validation/entitlements.plist 2>/dev/null
          grep -q 'aps-environment' /tmp/jar-apns-validation/entitlements.plist || { echo 'Push Notifications entitlement ontbreekt: activeer capability bij Apple Developer en ververs signing profiel.' >&2; exit 1; }
          grep -q 'production' /tmp/jar-apns-validation/entitlements.plist || { echo 'TestFlight moet productie-APNs gebruiken.' >&2; exit 1; }
          echo 'APNs entitlement aanwezig voor TestFlight.'
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
