# JustAReminder — veilige iOS TestFlight-build (niet openbaar publiceren)
# iOS Build Number: gebaseerd op de oplopende Codemagic projectbuildteller.
# Offset 5 voorkomt de eerdere Apple-duplicaatfout voor bundle version 5.
workflows:
  ios-ipa-controle:
    name: JustAReminder - v1.5 iOS UI-herstel + layoutfix (alleen TestFlight) (niet openbaar)
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: JustAReminder
    environment:
      node: v22.11.0
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: eu.justareminder.app
    scripts:
      - name: Installeer layoutfix, afhankelijkheden en controleer bestanden
        script: |
          set -eu
          node installeer-ios-layoutfix.mjs .
          node test-ios-layoutfix.mjs .
          npm install
          npm run check
          node scripts/check-github.mjs
          npm run check:iosfix
          npm run check:session
          npm run check:navigation
          npm run audit:source
          if [ "${JAR_RELEASE_CHANNEL:-testflight}" = "production" ]; then
            npm run audit:release
          fi
      - name: Genereer iOS-project met Capacitor 8 (SPM)
        script: |
          set -eu
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          test -f ios/App/App.xcodeproj/project.pbxproj
          # Codemagic verhoogt PROJECT_BUILD_NUMBER bij iedere projectbuild.
          # Buildnummers zijn daardoor oplopend en starten boven de al geüploade 5.
          case "${PROJECT_BUILD_NUMBER:-}" in
            ''|*[!0-9]*) echo 'Ongeldige Codemagic PROJECT_BUILD_NUMBER; stoppen om een dubbele upload te voorkomen.' >&2; exit 1 ;;
          esac
          export JAR_IOS_BUILD_NUMBER="$((5 + PROJECT_BUILD_NUMBER))"
          echo "Nieuwe Apple CFBundleVersion: ${JAR_IOS_BUILD_NUMBER}"
          node scripts/apply-ios-assets.mjs
      - name: Configureer code signing voor Apple-distributie
        script: |
          set -eu
          cd ios/App
          xcode-project use-profiles
      - name: Bouw ondertekende IPA voor TestFlight
        script: |
          set -eu
          cd ios/App
          xcode-project build-ipa \
            --project 'App.xcodeproj' \
            --scheme 'App' \
            --config 'Release'
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
