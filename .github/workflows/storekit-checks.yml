name: StoreKit source & security checks
on:
  pull_request:
    paths:
      - 'paywall-sandbox.js'
      - 'jar-install-storekit-sandbox.mjs'
      - 'jar-test-storekit-sandbox.mjs'
      - 'JARStoreKitSandbox.swift'
      - 'tests/**'
      - 'www/ios/abonnementen.html'
      - 'www/ios/world-locale.js'
      - 'www/index.html'
      - 'www/prive/dashboard.html'
      - 'paywall-sandbox.js'
      - 'www/family/family-dashboard.html'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/storekit-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storekit-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: StoreKit source checks (no app build, no payments)
        run: |
          node --check paywall-sandbox.js
          node --check jar-install-storekit-sandbox.mjs
          node --check jar-test-storekit-sandbox.mjs
          node tests/test-bridge.mjs
          node tests/test-paywall.mjs
          node --check www/ios/world-locale.js
          node tests/test-server-security.mjs
          node tests/test-ios-paywall-safearea.mjs
          node tests/test-world-locale.mjs

  ios-native-compile:
    name: Compile iOS app (no signing, no TestFlight upload)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Capacitor 8 and native JustAReminder plugins
        run: |
          set -eu
          node installeer-ios-layoutfix.mjs .
          node fix-family-mobile-forms.mjs .
          node jar-install-storekit-sandbox.mjs
          node jar-install-native-push.mjs
          npm install
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          node jar-install-native-push.mjs --native
          node jar-install-storekit-sandbox.mjs --native
      - name: Compile iOS 15-compatible app without certificate or TestFlight upload
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > /tmp/justareminder-xcodebuild.log 2>&1 || {
              grep -n -E 'error:|failed|BUILD FAILED|note: add' /tmp/justareminder-xcodebuild.log | tail -n 65 || true
              exit 1
            }
          echo 'App compiled for iOS Simulator without signing; no TestFlight upload.'
      - name: Archive physical-device iOS app (arm64, no signing or upload)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath /tmp/JustAReminder-unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive > /tmp/justareminder-archive.log 2>&1 || {
              echo '---- Xcode iOS device archive diagnostics ----'
              grep -n -E 'error:|failed|ARCHIVE FAILED|note: add|SwiftCompile' /tmp/justareminder-archive.log | tail -n 85 || true
              echo '---- end diagnostics ----'
              exit 1
            }
          echo 'iPhone device archive compiled without signing. No IPA or TestFlight upload.'
